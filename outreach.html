  <!doctype html>
  <html lang="en">
  <head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Retail Reach — Clienteling Generator</title>
  <style>
  .topbar{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;

    min-height:90px;

    padding:11px 15px;
    margin-bottom:30px;

    background: rgba(0,0,0,.95);

    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
  }
  .brand .t{
    font-weight:1000;
    letter-spacing:.7px;
    text-transform:uppercase;
    font-size:13px;
  }
  .brand .s{
    color:var(--muted);
    font-size:12.5px;
    margin-top:2px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:260px;
  }

  .brand img{
    height:34px;
    width:auto;
    filter:brightness(1.08);
  }
  .actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;

    gap:10px;

  flex-wrap:wrap;
    margin-left:auto;
  max-width:720px;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;

    border:1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);

    color: var(--muted);

    padding:8px 12px;
    border-radius:999px;
    font-size:13px;
  }

  .pill b{
    color:var(--text);
  }

  .dot{
    width:10px;
    height:10px;
    border-radius:999px;
    background:var(--muted);
  }

  .dot.gold{
    background:#c8a45a;
  }

  .dot.good{
    background:#2db37a;
  }

  .dot.warn{
    background:#d6a14a;
  }

  .dot.bad{
    background:#d14b4b;
  }
  :root{
    --panel: rgba(16,16,20,.84);
    --text:#f5f1ea;
    --muted:#c8c1b6;
    --brass:#c8a45a;
    --r:18px;
  }

  body{
    margin:0;
    font-family:system-ui;
    color:var(--text);
background:url("./kmk5.png") center/cover no-repeat fixed;
  }

  .wrap{max-width:1150px;margin:0 auto;padding:18px}
  .card{
    background: transparent;
    border:none;
    min-height: calc(100dvh - 36px);
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  h2{margin-bottom:10px}

  .section{margin-bottom:18px}
  .contentBox{
    margin-top:20px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    background: rgba(18,18,22,.82);
    box-shadow: 0 20px 70px rgba(0,0,0,.60);
    padding:16px;
  }
  .content{
    padding:16px;
    margin-top:0;
  }
  .center{
    width:100%;
    max-width:1180px;
    margin:0 auto;
  }

  .panel{
    border-radius:18px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.20);
    box-shadow: 0 18px 55px rgba(0,0,0,.22);
    overflow:hidden;
  }

  .panelHead{
    padding:14px 14px 10px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background: rgba(0,0,0,.14);
  }

  .panelBody{
    padding:16px;
  }

  .btnRow{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:16px;
  }

  textarea{
    margin-top:16px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
  }

  .products{
    border:1px solid rgba(255,255,255,.1);
    padding:10px;
    border-radius:10px;
  }

  .products label{display:block;margin:3px 0;font-size:13px}

  .btn{
    cursor:pointer;
    border:1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);
    color: var(--text);
    border-radius: 14px;
    padding: 10px 14px;
    font-weight: 1000;
    font-size: 13px;
    user-select:none;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }

  .btn:hover{
    filter:brightness(1.08);
    border-color:rgba(200,164,90,.40);
  }

  .btn.primary{
    background: linear-gradient(
      180deg,
      rgba(200,164,90,.96),
      rgba(177,138,68,.92)
    );

    border-color: rgba(200,164,90,.65);

    color:#0b0b0c;
  }

  .btn.active{
    border-color: rgba(200,164,90,.55);
    box-shadow: 0 0 0 4px rgba(200,164,90,.14);
  }textarea{
    width:100%;
    height:240px;
    border-radius:12px;
    background:#000;
    color:#fff;
    padding:15px;
  }
  </style>
  </head>

  <body>
  <div class="wrap">

  <div class="card">

  <div class="topbar">

    <div class="brand">
<img src="./kmklogo.png" alt="Retail Reach" />
      <div>
        <div class="t">RETAIL REACH</div>

        <div class="s">
          Client Outreach Engine • Goal Performance • Engagement Analytics
        </div>
      </div>
    </div>

    <div class="actions" id="nav">

      <span class="pill">
        <span class="dot gold"></span>
        Goal: <b id="uiGoal">6.4%</b>
      </span>

      <span class="pill">
        <span class="dot" id="uiStatusDot"></span>
        Status: <b id="uiStatus">—</b>
      </span>

      <a class="btn" href="./index.html">Dashboard</a>

      <a class="btn" href="./sheet.html">Weekly Entry</a>

      <a class="btn" href="./leaderboard.html">Leaderboard</a>

      <a class="btn" href="./email.html">Email Automation</a>

  <a class="btn primary active" href="./page5.html">
        Clienteling Generator
      </a>

      <a class="btn" href="./print.html">Print</a>

    </div>

  </div>
  <div class="contentBox">

  <div class="content">
  <div class="center">

  <div class="panel">

  <div class="panelHead">
  <h2>Outreach Generator</h2>
  </div>

  <div class="panelBody">


  <!-- OCCASION -->
  <div class="section">
  <select id="occasion">
  <option value="">No Occasion</option>
  <option>Canada Day</option>
  <option>BC Day</option>
  <option>Thanksgiving</option>
  <option>Christmas</option>
  <option>New Year</option>
  <option>Valentine’s Day</option>
  <option>Father’s Day</option>
  <option>Mother’s Day</option>
  <option>Black Friday</option>
  <option>Boxing Day</option>
  <option>Holiday Season</option>
  </select>
  </div>

  <!-- DISCOUNT -->
  <div class="section" id="discounts"></div>

  <!-- PRODUCTS -->
  <div class="grid">

  <div class="products">
  <b>WATCHES</b>
  <label><input type="checkbox" value="watch"> Watch</label>
  <label><input type="checkbox" value="leather watch"> Leather Watch</label>
  <label><input type="checkbox" value="gold watch"> Gold Watch</label>
  <label><input type="checkbox" value="automatic watch"> Automatic</label>
  <label><input type="checkbox" value="classic watch"> Classic</label>
  <label><input type="checkbox" value="bracelet watch"> Bracelet Watch</label>
  </div>

  <div class="products">
  <b>BAGS</b>
  <label><input type="checkbox" value="bag"> Bag</label>
  <label><input type="checkbox" value="backpack"> Backpack</label>
  <label><input type="checkbox" value="work bag"> Work Bag</label>
  <label><input type="checkbox" value="travel bag"> Travel Bag</label>
  <label><input type="checkbox" value="crossbody bag"> Crossbody</label>
  <label><input type="checkbox" value="tote bag"> Tote</label>
  <label><input type="checkbox" value="shoulder bag"> Shoulder</label>
  </div>

  <div class="products">
  <b>WALLETS</b>
  <label><input type="checkbox" value="wallet"> Wallet</label>
  <label><input type="checkbox" value="bifold wallet"> Bifold</label>
  <label><input type="checkbox" value="trifold wallet"> Trifold</label>
  <label><input type="checkbox" value="card case"> Card Case</label>
  </div>

  <div class="products">
  <b>JEWELLERY</b>
  <label><input type="checkbox" value="jewellery"> Jewellery</label>
  <label><input type="checkbox" value="bracelet"> Bracelet</label>
  <label><input type="checkbox" value="necklace"> Necklace</label>
  <label><input type="checkbox" value="ring"> Ring</label>
  </div>

  <div class="products">
  <b>ACCESSORIES</b>
  <label><input type="checkbox" value="belt"> Belt</label>
  <label><input type="checkbox" value="sunglasses"> Sunglasses</label>
  </div>

  <div class="products">
  <b>OPTIONS</b>
  <label><input type="checkbox" id="remoteCart"> Remote Cart</label>
  </div>

  </div>

  <br>

  <div class="btnRow">

  <button class="btn active" onclick="generate()">
  Generate Message
  </button>

  <button class="btn" onclick="copyMsg()">
  Copy
  </button>

  </div>

  <textarea id="output"></textarea>

  </div>
  </div>
  </div>

  </div>
  </div>

  </div>
  </div>

  <script>
  let selectedDiscount="";

  const discWrap=document.getElementById("discounts");
  [10,20,30,40,50,60,70,80].forEach(d=>{
    const b=document.createElement("button");
    b.textContent=d+"%";
    b.className="btn";
    b.onclick=()=>{
      selectedDiscount=d;
      document.querySelectorAll(".btn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
    };
    discWrap.appendChild(b);
  });

  function rand(arr){
    return arr[Math.floor(Math.random()*arr.length)];
  }

  function generate(){

    const occ=document.getElementById("occasion").value;
    const remote=document.getElementById("remoteCart").checked;

    const prods=[...document.querySelectorAll("input[type=checkbox]:checked")]
      .map(x=>x.value)
      .filter(x=>x);

    let productText="";
    if(prods.length===1) productText=prods[0];
    else if(prods.length>1){
      productText=prods.slice(0,-1).join(", ")+" and "+prods.slice(-1);
    }

    let msg="Hi X,\n\n";

    const occMsg={
      "Canada Day":[
        "Happy Canada Day 🇨🇦 hope you're having a great one 🙂",
        "Hope you're enjoying Canada Day 🇨🇦 today!"
      ],
      "BC Day":[
        "Hope you're enjoying the BC Day long weekend 🌲🙂",
        "Happy BC Day 🌲 enjoy the long weekend!"
      ],
      "Christmas":[
        "Merry Christmas 🎄 hope you're having a beautiful time 🙂"
      ]
    };

    if(occMsg[occ]) msg+=rand(occMsg[occ])+"\n\n";

    if(productText){
      msg+=rand([
        `Just wanted to check in — how are you liking your ${productText} so far? 😊`,
        `Hey! how’s your ${productText} been so far?`,
        `Quick check — are you enjoying your ${productText}? 🙂`
      ])+"\n\n";
    }

    msg+=rand([
      "We just got some new arrivals in store that would go really well with your style.",
      "We’ve received some fresh pieces that would complement your recent pick nicely."
    ])+"\n\n";

    if(selectedDiscount){
      msg+=rand([
        `We currently have ${selectedDiscount}% off on select styles.`,
        `${selectedDiscount}% offer is running on some great pieces right now.`
      ])+"\n\n";
    }

    if(remote){
      msg+="Also just letting you know — you can shop directly through us using our remote cart.\n";
      msg+="You can call us and we can place the order for you right away, and you’ll get outlet store pricing instead of full price.\n";
      msg+="We can also ship it directly to your home 🙂\n\n";
    }

    msg+=rand([
      "No pressure at all — just thought I’d share 🙂",
      "Just thought I’d let you know — no rush at all 🙂"
    ]);

    document.getElementById("output").value=msg;
  }

  function copyMsg(){
    const txt=document.getElementById("output");
    txt.select();
    document.execCommand("copy");
  }
  const goal = 6.4;
  const current = 0;

  const statusEl = document.getElementById("uiStatus");
  const dotEl = document.getElementById("uiStatusDot");

  if(current >= goal){
    statusEl.textContent = "On Track";
    dotEl.className = "dot good";
  }
  else if(current >= goal * 0.8){
    statusEl.textContent = "Close";
    dotEl.className = "dot warn";
  }
  else{
    statusEl.textContent = "Behind";
    dotEl.className = "dot bad";
  }
  </script>

  </body>
  </html>
